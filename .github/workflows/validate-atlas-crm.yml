name: Atlas CRM validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 05_Laboratorio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@1e60f620b9541d7fbb9e1ea5ea374e57d8f8a3a
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 05_Laboratorio/package.json
      - name: Generate pinned dependency lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Save generated lockfile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-crm-package-lock
          path: 05_Laboratorio/package-lock.json
          if-no-files-found: error
